<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="پلنر من">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>پلنر من</title>
<style>
:root {
  --bg:#f4f5f9; --card:#ffffff; --ink:#1c2230; --muted:#6b7385; --line:#dfe3ec;
  --accent:#4f46e5; --danger:#e11d48; --ok:#16a34a; --soft:#eef0ff;
}
body.dark {
  --bg:#12151d; --card:#1b2030; --ink:#e8ebf4; --muted:#9aa3b8; --line:#2b3247;
  --accent:#8b87ff; --soft:#262b45;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font-family:Tahoma,"Segoe UI",Vazirmatn,Arial,sans-serif; }
input,select,button,textarea { font:inherit; color:inherit; }
input[type=text],input[type=date],input[type=number],select,textarea {
  padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
textarea { width:100%; resize:vertical; }
.btn { border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:var(--accent); color:#fff; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
.btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.icon-btn { background:none; border:0; cursor:pointer; font-size:16px; color:var(--muted); padding:4px 6px; }
.muted { color:var(--muted); font-size:13px; }
h2 { margin:6px 0; font-size:20px; } h3 { margin:14px 0 6px; font-size:15px; }

/* نوار بالا */
#topbar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center;
  padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); }
#pageTitle { flex:1; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#view { max-width:900px; margin:0 auto; padding:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.row.between { justify-content:space-between; }

/* کشو */
#drawer { position:fixed; top:0; bottom:0; inset-inline-start:0; width:290px; max-width:88vw;
  background:var(--card); border-inline-end:1px solid var(--line); z-index:40; padding:14px;
  transform:translateX(100%); transition:transform .2s; overflow:auto; }
#drawer.open { transform:none; }
.drow { display:flex; align-items:center; border-bottom:1px solid var(--line); }
.dlink { flex:1; text-align:start; background:none; border:0; padding:10px 4px; cursor:pointer; }

/* پنجره‌ی شناور */
.modal.top { z-index:80; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:flex;
  align-items:center; justify-content:center; padding:14px; }
.sheet { background:var(--card); border-radius:16px; padding:16px; width:100%; max-width:480px;
  max-height:86vh; overflow:auto; }
.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.choice { display:block; width:100%; text-align:start; margin:6px 0; padding:10px 12px; cursor:pointer;
  background:var(--soft); border:1px solid var(--line); border-radius:10px; }
.choice small { display:block; color:var(--muted); margin-top:2px; }

/* سالانه */
.months { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.month { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 10px; cursor:pointer; text-align:center; min-height:110px; }
.month.now { border:2px solid var(--accent); background:var(--soft); }
.mname { font-weight:bold; font-size:17px; }
.mnum { color:var(--muted); font-size:13px; }
.mlink { margin-top:8px; font-size:12px; color:var(--accent); }
.month .icon-btn { position:absolute; top:4px; inset-inline-start:4px; }

/* ماهانه */
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
.cal .hd { text-align:center; font-size:12px; color:var(--muted); padding:4px 0; }
.day { min-height:70px; background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:4px; cursor:pointer; font-size:11px; overflow:hidden; }
.day b { font-size:13px; }
.day.today { border:2px solid var(--accent); background:var(--soft); }
.day.empty { background:transparent; border:0; cursor:default; }
.day .note { color:var(--muted); margin-top:2px; word-break:break-word; }

/* عادت‌ها */
.scroll { overflow-x:auto; }
table.habits { border-collapse:collapse; font-size:12px; }
table.habits th, table.habits td { border:1px solid var(--line); padding:3px 5px; text-align:center; }
table.habits td.name { text-align:start; white-space:nowrap; min-width:110px; font-size:13px; }
table.habits .todaycol { background:var(--soft); }

/* لیست کارها */
.bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
.bar > div { height:100%; width:0; background:var(--ok); transition:width .3s; }
li.task { display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); list-style:none; }
ul.tasks { margin:0; padding:0; }
li.task .main { flex:1; min-width:0; word-break:break-word; }
li.task.done .title { text-decoration:line-through; color:var(--muted); }
.meta { font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
.tag { padding:1px 8px; border-radius:99px; background:var(--line); }
.p-high { border-inline-start:4px solid var(--danger); padding-inline-start:8px !important; }
.p-mid  { border-inline-start:4px solid #f59e0b; padding-inline-start:8px !important; }
.p-low  { border-inline-start:4px solid var(--ok); padding-inline-start:8px !important; }
.late { color:var(--danger); font-weight:bold; }

/* رنگ‌آمیزی */
.tools { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
.sw { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
.sw.active { border-color:var(--ink); transform:scale(1.15); }
canvas.paint { width:100%; height:auto; touch-action:none; border-radius:12px;
  border:1px solid var(--line); background:#fff; cursor:crosshair; display:block; margin-top:10px; }
#toast { position:fixed; bottom:20px; inset-inline:0; margin:auto; width:max-content; max-width:90vw;
  background:#1c2230; color:#fff; padding:10px 16px; border-radius:10px; z-index:90; display:none; }

/* ---- افزوده‌های نسخه‌ی ۳ ---- */
.crumbs { align-items:center; }
.folders { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:8px; }
.folder { position:relative; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; }
.folder .fname { font-weight:bold; word-break:break-word; }
.folder .facts { position:absolute; top:2px; inset-inline-end:2px; }
.prio { color:#fff; padding:1px 8px; border-radius:99px; }
.goal { padding:10px 0; border-bottom:1px solid var(--line); }
.goal:last-child { border-bottom:0; }
.big { font-weight:bold; color:var(--accent); white-space:nowrap; padding:0 6px; }
.big.past { color:var(--muted); }
.bday { display:flex; gap:12px; align-items:center; background:linear-gradient(135deg,#fff1f7,#fff7d6); color:#1c2230;
  border:2px solid #f9a8d4; border-radius:16px; padding:12px 16px; margin-bottom:10px; }
.bicon { font-size:44px; animation:pop 1.4s ease-in-out infinite; }
@keyframes pop { 0%,100% { transform:scale(1) rotate(-6deg); } 50% { transform:scale(1.18) rotate(6deg); } }
.chip { border:1px solid var(--line); background:var(--soft); border-radius:99px; padding:6px 12px; cursor:pointer; }
.stats4 .stat { flex:1; min-width:120px; text-align:center; margin-top:12px; }
.chart { width:100%; height:auto; }
.donut { width:150px; height:150px; }
.hb { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
.hbl { width:110px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbt { flex:1; height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
.hbf { height:100%; border-radius:99px; }
.hbv { width:90px; flex:none; text-align:end; color:var(--muted); }
/* برنامه‌ی روزانه و تایمر */
.tl { position:relative; border:1px solid var(--line); border-radius:12px; background:var(--card); margin-top:12px; overflow:hidden; cursor:cell; }
.tl-line { position:absolute; right:50px; left:0; height:0; border-top:1px solid var(--line); }
.tl-hour { position:absolute; right:0; width:48px; text-align:center; font-size:11px; color:var(--muted); }
.tl-ev { position:absolute; border-radius:8px; color:#fff; padding:2px 6px; font-size:12px; overflow:hidden; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25); }
.tl-ev.done { opacity:.55; text-decoration:line-through; }
.tl-t { font-weight:bold; } .tl-s { font-size:10px; opacity:.9; }
.tl-ck { position:absolute; top:1px; inset-inline-start:2px; background:rgba(255,255,255,.3); border:0; border-radius:4px; color:#fff; cursor:pointer; }
.tl-now { position:absolute; right:50px; left:0; height:0; border-top:2px solid #ef4444; }
.timer-disp { font-size:52px; font-weight:bold; text-align:center; letter-spacing:2px; padding:10px 0; direction:ltr; }
.tlog { margin-top:8px; }
/* دانشگاه */
.nf { display:flex; flex-direction:column; gap:2px; min-width:120px; flex:1; font-size:12px; }
.nf input { width:100%; }
.topic { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:8px; background:var(--soft); }
.exam { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px; }
.uni-sec { margin-top:14px; padding-top:10px; border-top:1px dashed var(--line); }
/* کاغذ فلش‌کارت */
.paper { position:relative; width:100%; aspect-ratio:5/3; background-color:#fffef8; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:8px; }
.paper.ruled { background-image:linear-gradient(to bottom,transparent calc(100% - 1.5px),#9ec5e8 calc(100% - 1.5px)); background-size:100% 10%; }
.paper.grid { background-image:linear-gradient(to bottom,transparent calc(100% - 1px),#b9d3ea 0),linear-gradient(to right,transparent calc(100% - 1px),#b9d3ea 0); background-size:100% 8.333%,5% 100%; }
.paper canvas, .paper img { position:absolute; inset:0; width:100%; height:100%; display:block; }
.paper canvas { touch-action:none; cursor:crosshair; }
.fc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:12px; }
.fc { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; cursor:pointer; font-size:12px; }
@media (max-width:600px) {
  .months { grid-template-columns:repeat(2,1fr); }
  .day { min-height:56px; }
}
</style>
</head>
<body>

<div id="topbar">
  <button class="btn ghost" id="menuBtn" type="button" title="فهرست صفحه‌ها">☰</button>
  <button class="btn ghost" id="homeBtn" type="button" title="صفحه‌ی اصلی (سالانه)">🏠</button>
  <div id="pageTitle"></div>
  <button class="btn ghost" id="profBtn" type="button" title="پروفایل">👤</button>
  <button class="btn" id="addBtn" type="button">＋ صفحه</button>
  <button class="btn ghost" id="themeBtn" type="button" title="حالت شب/روز">◐</button>
</div>

<div id="drawer">
  <div class="row between"><b>صفحه‌های من</b><button class="icon-btn" id="closeDrawer" type="button">✕</button></div>
  <div id="drawerList"></div>
  <h3>پشتیبان‌گیری</h3>
  <div class="row">
    <button class="btn ghost" id="exportBtn" type="button">خروجی</button>
    <button class="btn ghost" id="importBtn" type="button">ورودی</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</div>

<div id="view"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   1) تقویم شمسی (جلالی)  — تبدیل میلادی ↔ شمسی و ابزارهای تقویم
   ===================================================================== */
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const WD_SHORT = ['ش','ی','د','س','چ','پ','ج'];
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);   // ارقام فارسی

function g2j(gy, gm, gd) {
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979;
  gy -= gy <= 1600 ? 621 : 1600;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
           + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
  jy += 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461);   days %= 1461;
  if (days > 365) { jy += Math.floor((days-1) / 365); days = (days-1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + (days < 186 ? days % 31 : (days-186) % 30);
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  let gy = jy <= 979 ? 621 : 1600;
  jy -= jy <= 979 ? 0 : 979;
  let days = 365*jy + Math.floor(jy/33)*8 + Math.floor(((jy%33)+3)/4) + 78 + jd
           + (jm < 7 ? (jm-1)*31 : (jm-7)*30 + 186);
  gy += 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) {
    gy += 100 * Math.floor(--days / 36524); days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days-1) / 365); days = (days-1) % 365; }
  let gd = days + 1;
  const leap = (gy%4===0 && gy%100!==0) || gy%400===0;
  const sal = [0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm = 0;
  while (gm < 13 && gd > sal[gm]) { gd -= sal[gm]; gm++; }
  return [gy, gm, gd];
}
function isLeapJ(jy) {                       // 30 اسفند وجود دارد؟
  const [gy, gm, gd] = j2g(jy, 12, 30);
  const b = g2j(gy, gm, gd);
  return b[0] === jy && b[1] === 12 && b[2] === 30;
}
function monthLength(jy, jm) { return jm <= 6 ? 31 : jm <= 11 ? 30 : (isLeapJ(jy) ? 30 : 29); }
function firstWeekdayIdx(jy, jm) {           // 0 = شنبه
  const [gy, gm, gd] = j2g(jy, jm, 1);
  return (new Date(gy, gm-1, gd).getDay() + 1) % 7;
}
function jToday() {
  const d = new Date();
  const [jy, jm, jd] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
  return { jy, jm, jd, wd: (d.getDay()+1) % 7 };
}
function todayISO() {                        // تاریخ میلادی محلی YYYY-MM-DD
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}


/* ---------- پردازش تصویر (برای تشخیص ناحیه‌ها) ---------- */
function removeSmall(a, W, H, minArea) {         // حذف لکه‌های ریز (مثل نقطه‌های کاغذ)
  const n = W * H, seen = new Uint8Array(n), st = new Int32Array(n), comp = new Int32Array(n);
  for (let s = 0; s < n; s++) {
    if (!a[s] || seen[s]) continue;
    let sp = 0, cnt = 0; st[sp++] = s; seen[s] = 1;
    while (sp) {
      const q = st[--sp]; comp[cnt++] = q; const x = q % W, y = (q / W) | 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= W) continue;
          const r = yy * W + xx; if (a[r] && !seen[r]) { seen[r] = 1; st[sp++] = r; }
        }
      }
    }
    if (cnt < minArea) for (let i = 0; i < cnt; i++) a[comp[i]] = 0;
  }
}
function dilate(src, W, H, r) {                  // ضخیم‌کردن (مربعی، جداپذیر)
  if (r <= 0) return src.slice();
  const n = W * H, mid = new Uint8Array(n), out = new Uint8Array(n);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = 0; for (let k = -r; k <= r && !v; k++) { const xx = x + k; if (xx >= 0 && xx < W && src[y * W + xx]) v = 1; }
    mid[y * W + x] = v;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = 0; for (let k = -r; k <= r && !v; k++) { const yy = y + k; if (yy >= 0 && yy < H && mid[yy * W + x]) v = 1; }
    out[y * W + x] = v;
  }
  return out;
}
function hslToRgb(h, s, l) {
  const f = (n) => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}
// نقطه‌ی هر روز (کسری از عرض/ارتفاع) برای عکس «mood tracker موج» (1080×1470)
const WAVE_SEEDS = [[463,418],[466,490],[103,738],[167,778],[252,797],[350,797],[473,771],[521,744],[567,723],[612,704],
  [655,684],[738,838],[798,824],[878,815],[955,744],[1000,659],[120,910],[105,980],[96,1058],[108,1381],[181,1379],
  [273,1373],[392,1163],[410,1238],[842,1130],[741,1215],[720,1275],[697,1344],[669,1402],[1010,1163],[959,1393]]
  .map(([x, y]) => [x / 1080, y / 1470]);

/* =====================================================================
   2) ابزارهای عمومی: ساخت المان، پیام، پنجره، ذخیره‌سازی
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);

// h(): ساخت سریع المان.  h("div", {class:"a", onclick:fn}, "متن", المان‌های_فرزند)
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function selectBox(options, value, onChange) {      // options: [[مقدار، برچسب], ...]
  const s = h('select', {}, options.map(([v, l]) => h('option', { value: v, text: l })));
  s.value = String(value);
  if (onChange) s.addEventListener('change', () => onChange(s.value));
  return s;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}
function openModal(title, content, wide) {
  closeModal();
  document.body.append(h('div', { class: 'modal', id: 'modal', onclick: (e) => { if (e.target.id === 'modal') closeModal(); } },
    h('div', { class: 'sheet', style: wide ? 'max-width:880px' : '' },
      h('div', { class: 'sheet-head' }, h('b', { text: title }), h('button', { class: 'icon-btn', text: '✕', onclick: closeModal })),
      content)));
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

/* ---------- پنجره‌های تأیید و ورود متن (داخل خود صفحه؛ جایگزین confirm/prompt مرورگر) ---------- */
function closeDialog2() { const m = $('#dialog2'); if (m) m.remove(); }
function overlay2(title, content) {
  closeDialog2();
  document.body.append(h('div', { class: 'modal top', id: 'dialog2', onclick: (e) => { if (e.target.id === 'dialog2') closeDialog2(); } },
    h('div', { class: 'sheet', style: 'max-width:420px' },
      h('div', { class: 'sheet-head' }, h('b', { text: title }), h('button', { class: 'icon-btn', text: '✕', onclick: closeDialog2 })), content)));
}
function askConfirm(msg, onYes, yesText) {
  overlay2('تأیید', h('div', {}, h('p', { text: msg }),
    h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { class: 'btn', style: 'background:var(--danger)', text: yesText || 'بله، انجام شود', onclick: () => { closeDialog2(); onYes(); } }),

/* =====================================================================
   2b) ابزارهای مشترک: تاریخ شمسی، نمودار، بوم قلم، کلید دوره‌ها
   ===================================================================== */
const pad2 = (n) => String(n).padStart(2, '0');
const isoOf = (gy, gm, gd) => gy + '-' + pad2(gm) + '-' + pad2(gd);
const parseISO = (iso) => iso.split('-').map(Number);
function fmtDate(iso, withYear) {                       // 2026-11-09 ← «۱۸ آبان»
  const [gy, gm, gd] = parseISO(iso); const [jy, jm, jd] = g2j(gy, gm, gd);
  return fa(jd) + ' ' + MONTHS[jm - 1] + (withYear || jy !== jToday().jy ? ' ' + fa(jy) : '');
}
function daysBetween(aISO, bISO) {
  const A = parseISO(aISO), B = parseISO(bISO);
  return Math.round((Date.UTC(B[0], B[1] - 1, B[2]) - Date.UTC(A[0], A[1] - 1, A[2])) / 86400000);
}
function addDaysISO(iso, n) {
  const [y, m, d] = parseISO(iso); const dt = new Date(y, m - 1, d + n);
  return isoOf(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}
function hashStr(s) { let x = 0; for (const ch of String(s)) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return x; }
function nowHHMM() { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function cssVar(n, def) { try { return getComputedStyle(document.body).getPropertyValue(n).trim() || def; } catch (e) { return def; } }
function pagesOf(type) { return state.pages.filter((p) => p.type === type); }

/* انتخابگر تاریخ شمسی: روز، ماه، سال.  get() ← تاریخ میلادی "YYYY-MM-DD" یا "" */
function jDatePicker(iso, allowEmpty, cb) {
  const t = jToday(); let jy = t.jy, jm = t.jm, jd = allowEmpty ? 0 : t.jd;
  if (iso) { const [gy, gm, gd] = parseISO(iso); [jy, jm, jd] = g2j(gy, gm, gd); }
  const yr = h('input', { type: 'number', value: jy, style: 'width:84px' });
  const mo = selectBox(MONTHS.map((n, i) => [i + 1, n]), jm);
  const dy = h('select');
  function fill(want) {
    const len = monthLength(Number(yr.value) || jy, Number(mo.value));
    dy.innerHTML = '';
    if (allowEmpty) dy.append(h('option', { value: '', text: '— روز —' }));
    for (let i = 1; i <= len; i++) dy.append(h('option', { value: i, text: fa(i) }));
    dy.value = want && Number(want) <= len ? String(want) : (allowEmpty ? '' : '1');
  }
  fill(jd);
  yr.addEventListener('change', () => { fill(dy.value); if (cb) cb(); }); mo.addEventListener('change', () => { fill(dy.value); if (cb) cb(); });
  dy.addEventListener('change', () => { if (cb) cb(); });
  return {
    el: h('span', { class: 'row' }, dy, mo, yr),
    get() {
      if (dy.value === '') return '';
      const [gy, gm, gd] = j2g(Number(yr.value), Number(mo.value), Number(dy.value)); return isoOf(gy, gm, gd);
    },
    set(v) {
      if (!v) { fill(''); dy.value = ''; return; }
      const [gy, gm, gd] = parseISO(v); const j = g2j(gy, gm, gd); yr.value = j[0]; mo.value = String(j[1]); fill(j[2]);
    }
  };
}

/* کلید دوره‌ها (برای هدف‌گذاری): off = 0 دوره‌ی جاری، -1 قبلی، ... */
const PERIODS = [['day', 'روزانه'], ['week', 'هفتگی'], ['month', 'ماهانه'], ['year', 'سالانه']];
const PERIOD_NOW = { day: 'امروز', week: 'این هفته', month: 'این ماه', year: 'امسال' };
function periodKey(period, off) {
  const t = new Date(); const j = jToday();
  if (period === 'day' || period === 'week') {
    const shift = period === 'day' ? off : -j.wd + off * 7;            // هفته از شنبه شروع می‌شود
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + shift);
    const [jy, jm, jd] = g2j(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return (period === 'week' ? 'w' : '') + jy + '-' + jm + '-' + jd;
  }
  if (period === 'month') {
    let m = j.jm - 1 + off; const y = j.jy + Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m + 1);
  }
  return String(j.jy + off);
}

/* ---------- نمودارها (بدون کتابخانه) ---------- */
function niceMax(v) {
  if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function barChart(labels, values, color) {      // اندیس 0 = قدیمی‌ترین، سمت راست (جهت فارسی)
  const W = 700, Hh = 260; const cv = h('canvas', { class: 'chart' }); cv.width = W; cv.height = Hh; const c = cv.getContext('2d');
  const ink = cssVar('--ink', '#1c2230'), mut = cssVar('--muted', '#6b7385'), line = cssVar('--line', '#dfe3ec');
  const pl = 12, pr = 50, pt = 18, pb = 30; const mx = niceMax(Math.max(0, ...values));
  c.font = '12px Tahoma, sans-serif'; c.lineWidth = 1; c.strokeStyle = line;
  for (let i = 0; i <= 4; i++) {
    const y = pt + (Hh - pt - pb) * (1 - i / 4);
    c.beginPath(); c.moveTo(pl, y); c.lineTo(W - pr, y); c.stroke();
    c.fillStyle = mut; c.textAlign = 'left'; c.fillText(fa(+(mx * i / 4).toFixed(1)), W - pr + 6, y + 4);
  }
  const n = values.length, slot = (W - pl - pr) / Math.max(1, n), bw = Math.min(38, slot * 0.62);
  values.forEach((val, i) => {
    const x = pl + slot * (n - 1 - i) + slot / 2, bh = (Hh - pt - pb) * val / mx;
    c.fillStyle = color; c.fillRect(x - bw / 2, Hh - pb - bh, bw, bh);
    c.textAlign = 'center';
    if (n <= 16 && val > 0) { c.fillStyle = ink; c.fillText(fa(+val.toFixed(1)), x, Hh - pb - bh - 5); }
    if (n <= 16 || i % Math.ceil(n / 12) === 0) { c.fillStyle = mut; c.fillText(labels[i], x, Hh - pb + 17); }
  });
  return cv;
}
function donut(parts, centerText) {
  const S = 200; const cv = h('canvas', { class: 'donut' }); cv.width = cv.height = S; const c = cv.getContext('2d');
  const total = parts.reduce((s, x) => s + x.value, 0); let a = -Math.PI / 2;
  c.lineWidth = 30;
  if (!total) { c.strokeStyle = cssVar('--line', '#dfe3ec'); c.beginPath(); c.arc(S / 2, S / 2, 70, 0, 7); c.stroke(); }
  parts.forEach((x) => {
    if (!x.value) return; const da = 2 * Math.PI * x.value / total;
    c.strokeStyle = x.color; c.beginPath(); c.arc(S / 2, S / 2, 70, a, a + da); c.stroke(); a += da;
  });
  c.fillStyle = cssVar('--ink', '#1c2230'); c.font = 'bold 28px Tahoma, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(centerText, S / 2, S / 2);
  return cv;
}
function hbar(label, frac, text, color) {       // نوار افقی با DOM
  return h('div', { class: 'hb' }, h('span', { class: 'hbl', text: label }),
    h('div', { class: 'hbt' }, h('div', { class: 'hbf', style: 'width:' + Math.round(Math.min(1, Math.max(0, frac)) * 100) + '%;background:' + (color || 'var(--accent)') })),
    h('span', { class: 'hbv', text }));
}

/* ---------- بوم دست‌نویس (قلم دیجیتال) ---------- */
function inkPad(getPen) {
  const W = 900, H = 540;
  const cv = h('canvas', { width: W, height: H }); const c = cv.getContext('2d');
  const wrap = h('div', { class: 'paper ruled' }, cv);
  let drawing = false, pts = [], ink = false; const hist = [];
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5 }; };
  const snap = () => { hist.push(cv.toDataURL('image/png')); if (hist.length > 15) hist.shift(); };
  function setup(pt) {
    const pen = getPen();
    c.globalCompositeOperation = pen.tool === 'eraser' ? 'destination-out' : 'source-over';
    c.strokeStyle = c.fillStyle = pen.color; c.lineCap = c.lineJoin = 'round';
    const k = pen.tool === 'eraser' ? 5 : 1; const pr = pt.p === 0.5 ? 1 : 0.4 + pt.p * 1.2;   // فشار قلم
    c.lineWidth = pen.size * k * pr; return c.lineWidth;
  }
  cv.addEventListener('pointerdown', (e) => {
    if (getPen().penOnly && e.pointerType === 'touch') return;
    e.preventDefault(); snap(); drawing = true; ink = true; cv.setPointerCapture(e.pointerId);
    const q = pos(e); pts = [q]; const w = setup(q); c.beginPath(); c.arc(q.x, q.y, w / 2, 0, 7); c.fill();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return; const q = pos(e); pts.push(q); const n = pts.length; setup(q);
    c.beginPath();
    if (n === 2) { c.moveTo(pts[0].x, pts[0].y); c.lineTo((pts[0].x + q.x) / 2, (pts[0].y + q.y) / 2); }
    else { const a = pts[n - 3], b = pts[n - 2];
      c.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2); c.quadraticCurveTo(b.x, b.y, (b.x + q.x) / 2, (b.y + q.y) / 2); }
    c.stroke();
  });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const loadURL = (u, cb) => { const im = new Image(); im.onload = () => { c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H); c.drawImage(im, 0, 0, W, H); if (cb) cb(); }; im.src = u; };
  return {
    el: wrap,
    hasInk: () => ink,
    load(u) { if (u) { ink = true; loadURL(u); } },
    url() { return cv.toDataURL('image/webp', 0.92); },      // شفاف؛ در مرورگر بدون webp خودکار png می‌شود
    clear() { snap(); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H); ink = false; },
    undo() { const u = hist.pop(); if (!u) return; loadURL(u); },
    setPaper(name) { wrap.className = 'paper ' + name; },
    setTouch(penOnly) { cv.style.touchAction = penOnly ? 'pan-y pinch-zoom' : 'none'; }
  };
}

/* =====================================================================
   3) مدل صفحه‌ها و مسیریابی
   صفحه = { id, type, title, params:{year,month}, data:{...} }
   ===================================================================== */
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const getPage = (id) => state.pages.find((p) => p.id === id);
const linkKey = (y, m) => y + '-' + m;

function pageTitle(type, params) {
  const T = TEMPLATES[type];
  if (params.month) return T.label + ' – ' + MONTHS[params.month - 1] + ' ' + fa(params.year);
  if (T.scope === 'year' && params.year) return T.label + ' ' + fa(params.year);
  return T.label;
}
function createPage(type, params = {}) {
  const p = { id: newId(), type, params, title: pageTitle(type, params), data: TEMPLATES[type].defaults(params) };
  state.pages.push(p);
  save();
  return p;
}
function pageBlobKeys(p) {                    // همه‌ی کلیدهای حافظه‌ی وابسته به یک صفحه (عکس، نقاشی، کارت‌ها)
  const ks = [imgKey(p.id), drawKey(p.id)];
  if (p.type === 'flashcards') p.data.cards.forEach((c) => ks.push(cardKey(c.id, 'f'), cardKey(c.id, 'b')));
  return ks;
}
function deletePage(id) {
  const p = getPage(id); if (!p) return;
  askConfirm('صفحه‌ی «' + p.title + '» حذف شود؟', () => doDeletePage(p, id));
}
function doDeletePage(p, id) {
  state.pages = state.pages.filter((x) => x.id !== id);
  for (const k of Object.keys(state.links)) if (state.links[k] === id) delete state.links[k];
  if (p.type === 'university') { migrateUni(p.data); p.data.terms.forEach((T) => T.courses.forEach((c) => { removeUniTasks((u) => u.c === c.id); removeUniFolder(c.id); })); }
  try { pageBlobKeys(p).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  save();
  if (location.hash.slice(1) === id) go(''); else render();
}
function homePage() {
  const t = jToday();
  let p = state.pages.find((x) => x.type === 'yearly' && x.params.year === t.jy)
       || state.pages.find((x) => x.type === 'yearly');
  if (!p) p = createPage('yearly', { year: t.jy });
  return p;
}
function currentPage() { return getPage(location.hash.slice(1)) || homePage(); }
function go(id) {
  const nh = id ? '#' + id : '';
  if (location.hash === nh || (!nh && !location.hash)) render(); else location.hash = nh;
}

/* انتخاب صفحه برای یک ماه از سالانه */
function openMonth(y, m) {

  if (id && getPage(id)) go(id); else chooseForMonth(y, m);
}
function chooseForMonth(y, m) {
  const box = h('div');
  const existing = state.pages.filter((p) => !HIDDEN_TYPES.includes(p.type));
  box.append(h('h3', { text: 'صفحه‌های موجود' }));

  existing.forEach((p) => box.append(h('button', { class: 'choice', onclick: () => {

/* =====================================================================

        if (lp) card.append(h('button', { class: 'icon-btn', text: '✎', title: 'تغییر صفحه‌ی این ماه',
          onclick: (e) => { e.stopPropagation(); chooseForMonth(y, m); } }));
        grid.append(card);
      });

      v.append(h('p', { class: 'muted', text: 'امروز: ' + WEEKDAYS[t.wd] + ' ' + fa(t.jd) + ' ' + MONTHS[t.jm - 1] + ' ' + fa(t.jy) }));

        cal.append(h('div', { class: 'day' + (isToday ? ' today' : ''), onclick: () => editDay(p, day) },

/* =====================================================================
   5) لیست کارها: پوشه‌ی تو در تو، پنج اولویت، دسته، روز و ساعت
   ساختار داده:  root = { id, name, folders:[ پوشه... ], tasks:[ کار... ] }
   ===================================================================== */
const PRIOS = [null, { n: 'فوری', c: '#e11d48' }, { n: 'مهم', c: '#f97316' }, { n: 'متوسط', c: '#eab308' },
  { n: 'کم', c: '#22c55e' }, { n: 'اختیاری', c: '#94a3b8' }];
const mkFolder = (name) => ({ id: newId(), name, folders: [], tasks: [] });

function todoDefaults() { return { root: { id: 'root', name: 'اصلی', folders: [], tasks: [] }, cats: [], path: [], filter: 'all', search: '', sort: 'created', catFilter: '', sub: false }; }
function migrateTodo(d) {                          // سازگاری با نسخه‌ی قبلی (لیست ساده)
  if (d.root) return;
  const map = { high: 1, mid: 3, low: 4 }; const old = d.tasks || [];
  d.root = { id: 'root', name: 'اصلی', folders: [], tasks: old.map((t) => ({ id: t.id, title: t.title, done: !!t.done,
    pr: map[t.priority] || 3, cat: t.category || '', date: t.due || '', time: '', created: t.created || Date.now() })) };
  d.cats = [...new Set(old.map((t) => t.category).filter(Boolean))];
  d.path = []; d.catFilter = ''; d.sub = false; delete d.tasks;
}
function folderAt(root, path) { let f = root; for (const id of path) { const n = f.folders.find((x) => x.id === id); if (!n) break; f = n; } return f; }
function countTasks(f) { let tot = f.tasks.length, done = f.tasks.filter((t) => t.done).length; f.folders.forEach((x) => { const c = countTasks(x); tot += c.tot; done += c.done; }); return { tot, done }; }
function flatFolders(f, depth = 0, out = []) { out.push({ f, depth }); f.folders.forEach((x) => flatFolders(x, depth + 1, out)); return out; }
function eachTask(f, fn) { f.tasks.forEach(fn); f.folders.forEach((x) => eachTask(x, fn)); }
function allTasksOf(page) { migrateTodo(page.data); const out = []; eachTask(page.data.root, (t) => out.push(t)); return out; }
const dueStr = (t) => t.date ? t.date + ' ' + (t.time || '23:59') : '';
const isLate = (t) => !t.done && t.date && dueStr(t) < todayISO() + ' ' + nowHHMM();

function renderTodo(p, v) {
  const d = p.data; migrateTodo(d);
  const cur = () => folderAt(d.root, d.path);

  const crumbs = h('div', { class: 'row crumbs' });

    h('div', { class: 'row between muted', style: 'margin-top:6px' }, stDone, stToday)));

  /* پوشه‌ها */
  const folderBox = h('div', { class: 'folders' });
  v.append(h('div', { class: 'card' },
    h('div', { class: 'row between' }, h('b', { text: 'پوشه‌ها' }),

          askText('نام پوشه:', '', (n) => { cur().folders.push(mkFolder(n)); commit(); });
        } }),
        h('button', { class: 'btn ghost', text: 'دسته‌ها', onclick: manageCats }))),
    folderBox));

  /* افزودن کار */
  const title = h('input', { type: 'text', placeholder: 'کار جدید را بنویسید و Enter بزنید', style: 'width:100%' });
  const pri = prioSelect(3); const cat = catSelect(''); const dp = jDatePicker('', true);
  const tm = h('input', { type: 'time' });
  const add = () => {
    const t = title.value.trim(); if (!t) return;
    cur().tasks.push({ id: Date.now(), title: t, done: false, pr: Number(pri.value), cat: cat.value, date: dp.get(), time: dp.get() ? tm.value : '', created: Date.now() });
    title.value = ''; dp.set(''); tm.value = ''; commit();
  };
  title.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  v.append(h('div', { class: 'card' }, title,
    h('div', { class: 'row', style: 'margin-top:8px' }, pri, cat),

    h('button', { class: 'btn', style: 'margin-top:8px', text: 'افزودن به این پوشه', onclick: add })));

  /* فیلترها */
  const tabs = h('div', { class: 'row' });

    tabs.append(h('button', { class: 'btn ghost', 'data-f': k, text: l, onclick: () => { d.filter = k; commit(); } }));

  search.addEventListener('input', () => { d.search = search.value; draw(); });
  const sort = selectBox([['created', 'ترتیب افزودن'], ['due', 'نزدیک‌ترین موعد'], ['priority', 'اولویت']], d.sort, (x) => { d.sort = x; commit(); });
  const catF = h('select'); // پر می‌شود در draw
  catF.addEventListener('change', () => { d.catFilter = catF.value; commit(); });
  const subCb = h('input', { type: 'checkbox', checked: d.sub, onchange: () => { d.sub = subCb.checked; commit(); } });
  v.append(h('div', { class: 'card' }, tabs,
    h('div', { class: 'row', style: 'margin-top:8px' }, search, sort, catF),
    h('label', { class: 'muted', style: 'display:block;margin-top:6px' }, subCb, ' شامل کارهای زیرپوشه‌ها')));

  const ul = h('ul', { class: 'tasks' });
  v.append(h('div', { class: 'card' }, ul, h('button', { class: 'btn ghost', style: 'margin-top:10px', text: 'حذف انجام‌شده‌های این پوشه', onclick: () => {

  } })));

  function prioSelect(val) { return selectBox([1, 2, 3, 4, 5].map((i) => [i, fa(i) + ' – ' + PRIOS[i].n]), val); }
  function catSelect(val) { return selectBox([['', 'بدون دسته']].concat(d.cats.map((c) => [c, c])), val); }

  function collect(f, trail) {
    let out = f.tasks.map((t) => ({ t, owner: f, trail }));
    if (d.sub) f.folders.forEach((x) => { out = out.concat(collect(x, trail.concat(x.name))); });
    return out;
  }
  function visible() {
    const q = d.search.trim().toLowerCase();
    const list = collect(cur(), []).filter(({ t }) => {
      if (d.filter === 'active' && t.done) return false;
      if (d.filter === 'done' && !t.done) return false;
      if (d.filter === 'today' && t.date !== todayISO()) return false;
      if (d.catFilter && t.cat !== d.catFilter) return false;
      if (q && !(t.title + ' ' + t.cat).toLowerCase().includes(q)) return false;
      return true;
    });
    list.sort((a, b) => d.sort === 'due' ? (dueStr(a.t) || '9999').localeCompare(dueStr(b.t) || '9999')

    return list;
  }
  function draw() {
    // مسیر
    const trail = [{ id: null, name: d.root.name }]; let f = d.root; const valid = [];

        h('div', { class: 'facts' },
          h('button', { class: 'icon-btn', text: '✎', title: 'تغییر نام', onclick: (e) => { e.stopPropagation(); askText('نام پوشه:', fo.name, (n) => { fo.name = n; commit(); }); } }),
          h('button', { class: 'icon-btn', text: '🗑', title: 'حذف', onclick: (e) => {

    // فهرست دسته‌ها در فرم افزودن

    [['', 'بدون دسته']].concat(d.cats.map((c) => [c, c])).forEach(([val, l]) => cat.append(h('option', { value: val, text: l })));
    cat.value = d.cats.includes(cv0) ? cv0 : '';

function goalStreak(g) {                           // چند دوره‌ی پیاپی به هدف رسیده‌اید
  let s = (g.logs[periodKey(g.period, 0)] || 0) >= g.target ? 1 : 0;
  for (let off = -1; off > -400; off--) { if ((g.logs[periodKey(g.period, off)] || 0) >= g.target) s++; else break; }
  return s;
}

  const t = jToday(); const eff = (y) => Math.min(pe.d, monthLength(y, pe.m));

  if (left < 0) { y++; g = j2g(y, pe.m, eff(y)); iso = isoOf(g[0], g[1], g[2]); left = daysBetween(todayISO(), iso); }

function trackerSeries(d, n, bin) {                // n روز اخیر؛ bin = تعداد روز در هر ستون
  const today = todayISO(); const labels = [], values = [];
  for (let start = n - bin; start >= 0; start -= bin) {
    let sum = 0; for (let k = 0; k < bin; k++) sum += d.entries[addDaysISO(today, -(start + k))] || 0;
    const [gy, gm, gd] = parseISO(addDaysISO(today, -start)); const j = g2j(gy, gm, gd);
    labels.push(bin === 1 ? fa(j[2]) : fa(j[2]) + '/' + fa(j[1])); values.push(+sum.toFixed(2));
  }
  return { labels, values };
}
function trackerTotals(d) {
  const today = todayISO(); const sum = (n) => { let s = 0; for (let i = 0; i < n; i++) s += d.entries[addDaysISO(today, -i)] || 0; return +s.toFixed(2); };
  const j = jToday(); let month = 0;
  Object.entries(d.entries).forEach(([iso, val]) => { const [gy, gm, gd] = parseISO(iso); const q = g2j(gy, gm, gd); if (q[0] === j.jy && q[1] === j.jm) month += val; });
  const active = Object.keys(d.entries).filter((k) => daysBetween(k, today) < 30 && daysBetween(k, today) >= 0 && d.entries[k] > 0).length;
  return { today: d.entries[today] || 0, week: sum(7), month: +month.toFixed(2), avg: active ? +(sum(30) / active).toFixed(2) : 0 };
}

    v.append(h('h2', { text: 'ردیاب عددی جدید' }), h('div', { class: 'card' }, nm, dl, un,
      h('button', { class: 'btn', style: 'margin-top:10px', text: 'ساخت', onclick: () => {

      } })));
    return;
  }
  const unit = d.unit ? ' ' + d.unit : '';
  v.append(h('h2', { text: '📈 ' + d.name }));
  const tt = trackerTotals(d);
  v.append(h('div', { class: 'row stats4' },
    [['امروز', tt.today], ['۷ روز اخیر', tt.week], ['این ماه', tt.month], ['میانگین روزهای فعال', tt.avg]].map(([l, x]) =>
      h('div', { class: 'card stat' }, h('div', { class: 'muted', text: l }), h('b', { text: fa(x) + unit })))));
  const dp = jDatePicker(todayISO(), false); const val = h('input', { type: 'number', step: 'any', placeholder: 'مقدار', style: 'width:110px' });
  const put = (add) => {

  function drawChart() {

/* =====================================================================
   6f) آمار و نمودارها — خلاصه‌ی همه‌ی ردیاب‌ها، کارها، عادت‌ها، هدف‌ها و فلش‌کارت‌ها
   ===================================================================== */
function renderStats(p, v) {
  const d = p.data;
  v.append(backBar(p), h('h2', { text: '📊 آمار و نمودارها' }));
  const body = h('div');
  const rangeSel = selectBox([[7, '۷ روز اخیر'], [14, '۱۴ روز اخیر'], [30, '۳۰ روز اخیر'], [91, '۱۳ هفته‌ی اخیر']], d.range || 14, (x) => { d.range = Number(x); save(); build(); });
  v.append(h('div', { class: 'row between' }, h('span', { class: 'muted', text: 'بازه‌ی نمودارها:' }), rangeSel), body);
  build();

  function section(title) { const c = h('div', { class: 'card' }, h('b', { text: title })); body.append(c); return c; }
  function build() {
    body.innerHTML = ''; let any = false; const n = d.range || 14;

    /* ردیاب‌های عددی */
    pagesOf('tracker').filter((pg) => pg.data.name).forEach((pg) => {
      any = true; const t = pg.data; const unit = t.unit ? ' ' + t.unit : ''; const tt = trackerTotals(t);
      const c = section('📈 ' + t.name);
      c.append(h('div', { class: 'row muted', style: 'margin:6px 0' },
        h('span', { text: 'امروز: ' + fa(tt.today) + unit }), h('span', { text: '• ۷ روز: ' + fa(tt.week) + unit }),
        h('span', { text: '• این ماه: ' + fa(tt.month) + unit }), h('span', { text: '• میانگین روز فعال: ' + fa(tt.avg) + unit })));
      const s = trackerSeries(t, n, n > 31 ? 7 : 1); c.append(barChart(s.labels, s.values, '#4f46e5'));
    });

    /* کارها */
    const todoPages = pagesOf('todo'); const tasks = []; todoPages.forEach((pg) => allTasksOf(pg).forEach((t) => tasks.push(t)));
    if (tasks.length) {
      any = true; const done = tasks.filter((t) => t.done).length; const open = tasks.length - done; const late = tasks.filter(isLate).length;
      const c = section('✅ کارها');
      c.append(h('div', { class: 'row', style: 'align-items:center;margin-top:8px' },
        donut([{ value: done, color: '#22c55e' }, { value: open, color: '#94a3b8' }], fa(Math.round(done / tasks.length * 100)) + '٪'),
        h('div', {}, h('div', { text: 'انجام‌شده: ' + fa(done) }), h('div', { text: 'باقی‌مانده: ' + fa(open) }), h('div', { class: late ? 'late' : '', text: 'گذشته از موعد: ' + fa(late) }))));
      c.append(h('div', { class: 'muted', style: 'margin-top:8px', text: 'کارهای باقی‌مانده بر اساس اولویت:' }));
      const maxP = Math.max(1, ...[1, 2, 3, 4, 5].map((i) => tasks.filter((t) => !t.done && t.pr === i).length));
      [1, 2, 3, 4, 5].forEach((i) => { const k = tasks.filter((t) => !t.done && t.pr === i).length; c.append(hbar(fa(i) + ' ' + PRIOS[i].n, k / maxP, fa(k), PRIOS[i].c)); });
      const byCat = {}; tasks.filter((t) => !t.done && t.cat).forEach((t) => { byCat[t.cat] = (byCat[t.cat] || 0) + 1; });
      const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 6);
      if (cats.length) { c.append(h('div', { class: 'muted', style: 'margin-top:8px', text: 'باقی‌مانده بر اساس دسته:' })); cats.forEach(([k, x]) => c.append(hbar(k, x / cats[0][1], fa(x)))); }
    }

    /* عادت‌ها */
    pagesOf('habits').filter((pg) => pg.data.habits.length).forEach((pg) => {
      any = true; const { year, month } = pg.params; const t = jToday(); const len = monthLength(year, month);
      const upto = (t.jy === year && t.jm === month) ? t.jd : (t.jy > year || (t.jy === year && t.jm > month) ? len : 0);
      const c = section('🔁 ' + pg.title);
      if (!upto) c.append(h('p', { class: 'muted', text: 'این ماه هنوز شروع نشده.' }));
      else pg.data.habits.forEach((hb) => {
        let k = 0; for (let day = 1; day <= upto; day++) if (pg.data.checks[hb.id + '|' + day]) k++;
        c.append(hbar(hb.name, k / upto, fa(k) + ' از ' + fa(upto) + ' روز', '#16a34a'));
      });
    });

    /* هدف‌ها */
    pagesOf('goals').filter((pg) => pg.data.goals.length).forEach((pg) => {
      any = true; const c = section('🎯 ' + pg.title);
      pg.data.goals.forEach((g) => {
        const x = g.logs[periodKey(g.period, 0)] || 0; const st = goalStreak(g);
        c.append(hbar(g.title + ' (' + PERIOD_NOW[g.period] + ')', x / g.target, fa(x) + ' از ' + fa(g.target) + (st > 1 ? ' 🔥' + fa(st) : ''), x >= g.target ? '#16a34a' : '#4f46e5'));
      });
    });

    /* تایمر */
    pagesOf('timer').filter((pg) => pg.data.sessions.length).forEach((pg) => {
      any = true; const c = section('⏱ ' + pg.title); const today = todayISO(); const days = Math.min(n, 31); const labels = [], vals = [];
      for (let i = days - 1; i >= 0; i--) { const iso = addDaysISO(today, -i); labels.push(fa(g2j(...parseISO(iso))[2])); vals.push(r2(pg.data.sessions.filter((x) => isoOfMs(x.start) === iso).reduce((s, x) => s + x.sec, 0) / 3600)); }
      c.append(h('div', { class: 'muted', style: 'margin-top:6px', text: 'ساعت مطالعه‌ی هر روز:' }), barChart(labels, vals, '#8b5cf6'));
      const by = {}; pg.data.sessions.filter((x) => daysBetween(isoOfMs(x.start), today) < n).forEach((x) => { const k = x.uni ? (findUniTopic(x.uni) ? findUniTopic(x.uni).c.name : 'دانشگاه') : subjectLabel(x.subject); by[k] = (by[k] || 0) + x.sec; });
      const es = Object.entries(by).sort((a, b) => b[1] - a[1]); es.forEach(([k, x]) => c.append(hbar(k, x / es[0][1], durText(x), '#8b5cf6')));
    });

    /* دانشگاه */
    pagesOf('university').forEach((pg) => {
      migrateUni(pg.data); const T = pg.data.terms.find((t) => t.id === pg.data.sel) || pg.data.terms[0]; if (!T || !T.courses.length) return;
      any = true; const g = gpaOf(T.courses); const c = section('🎓 ' + T.name + (g != null ? ' — معدل ' + fnum(g) : ''));
      const mh = Math.max(1, ...T.courses.map((x) => courseStats(x).hours));
      c.append(h('div', { class: 'muted', style: 'margin-top:6px', text: 'ساعت مطالعه‌ی هر درس:' }));
      T.courses.forEach((x) => c.append(hbar(x.name, courseStats(x).hours / mh, fnum(courseStats(x).hours) + ' ساعت', '#4f46e5')));
      const tp = T.courses.filter((x) => courseStats(x).avgTest != null);
      if (tp.length) { c.append(h('div', { class: 'muted', style: 'margin-top:8px', text: 'میانگین درصد تست‌ها:' })); tp.forEach((x) => c.append(hbar(x.name, courseStats(x).avgTest / 100, fnum(courseStats(x).avgTest) + '٪', '#f97316'))); }
      const gr = T.courses.filter((x) => x.final != null);
      if (gr.length) { c.append(h('div', { class: 'muted', style: 'margin-top:8px', text: 'نمره‌ی نهایی (از ۲۰):' })); gr.forEach((x) => c.append(hbar(x.name, score20(x) / 20, fnum(score20(x)), '#16a34a'))); }
    });

    /* فلش‌کارت‌ها */
    pagesOf('flashcards').filter((pg) => pg.data.cards.length).forEach((pg) => {
      any = true; const f = pg.data; const c = section('🗂 ' + pg.title + ' — ' + fa(f.cards.length) + ' کارت');
      const mx = Math.max(1, ...[1, 2, 3, 4, 5].map((b) => f.cards.filter((x) => x.box === b).length));
      c.append(h('div', { class: 'muted', style: 'margin-top:6px', text: 'تعداد کارت در هر جعبه (۱ = تازه/ضعیف، ۵ = مسلط):' }));
      [1, 2, 3, 4, 5].forEach((b) => { const k = f.cards.filter((x) => x.box === b).length; c.append(hbar('جعبه ' + fa(b), k / mx, fa(k), '#8b5cf6')); });
      const labels = [], vals = []; const today = todayISO(); const days = Math.min(n, 31);
      for (let i = days - 1; i >= 0; i--) { const iso = addDaysISO(today, -i); const q = g2j(...parseISO(iso)); const l = (f.log[iso] || { r: 0, w: 0 }); labels.push(fa(q[2])); vals.push(l.r + l.w); }
      c.append(h('div', { class: 'muted', style: 'margin-top:8px', text: 'تعداد کارت‌های مرورشده در روز:' }), barChart(labels, vals, '#8b5cf6'));
      let r = 0, w = 0; Object.values(f.log).forEach((l) => { r += l.r; w += l.w; });
      if (r + w) c.append(h('p', { class: 'muted', text: 'دقت کل مرورها: ' + fa(Math.round(r / (r + w) * 100)) + '٪' }));
    });

    if (!any) body.append(h('div', { class: 'card' }, h('p', { text: 'هنوز داده‌ای برای نمایش نیست. چند صفحه‌ی «ردیاب عددی»، «لیست کارها»، «ردیاب عادت»، «هدف‌گذاری» یا «فلش‌کارت» بسازید و داده وارد کنید؛ نمودارها خودکار اینجا ظاهر می‌شوند.' })));
  }
}

/* =====================================================================
   6g) فلش‌کارت دست‌نویس (با قلم دیجیتال؛ رو و پشت خط‌دار)
   درس ← مبحث ← کارت.  تصویر هر طرف کارت جدا در حافظه‌ی مرورگر ذخیره می‌شود.
   ===================================================================== */
const cardKey = (id, side) => 'planner2-card-' + id + '-' + side;
function removeCardData(c) { try { localStorage.removeItem(cardKey(c.id, 'f')); localStorage.removeItem(cardKey(c.id, 'b')); } catch (e) {} }

function renderFlash(p, v) {
  const d = p.data;
  v.append(backBar(p), h('h2', { text: '🗂 فلش‌کارت دست‌نویس' }));
  const subSel = h('select'), topSel = h('select'); const grid = h('div', { class: 'fc-grid' }); const info = h('span', { class: 'muted' });
  function fillSubs() {
    subSel.innerHTML = ''; [['', 'همه‌ی درس‌ها']].concat(d.subjects.map((s) => [s.id, s.name])).forEach(([val, l]) => subSel.append(h('option', { value: val, text: l })));
    subSel.value = d.sel.sid; if (d.sel.sid && !d.subjects.find((s) => s.id === d.sel.sid)) { d.sel.sid = ''; d.sel.tid = ''; subSel.value = ''; }
    fillTops();

    topSel.innerHTML = ''; topSel.append(h('option', { value: '', text: 'همه‌ی مبحث‌ها' }));
    const s = d.subjects.find((x) => x.id === d.sel.sid); if (s) s.topics.forEach((t) => topSel.append(h('option', { value: t.id, text: t.name })));
    topSel.value = d.sel.tid; if (d.sel.tid && !(s && s.topics.find((t) => t.id === d.sel.tid))) { d.sel.tid = ''; topSel.value = ''; }
  }
  subSel.addEventListener('change', () => { d.sel.sid = subSel.value; d.sel.tid = ''; save(); fillTops(); drawGrid(); });
  topSel.addEventListener('change', () => { d.sel.tid = topSel.value; save(); drawGrid(); });
  const filtered = () => d.cards.filter((c) => (!d.sel.sid || c.sid === d.sel.sid) && (!d.sel.tid || c.tid === d.sel.tid));

  v.append(h('div', { class: 'card' },
    h('div', { class: 'row' }, subSel, topSel, info),
    h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { class: 'btn', text: '✏️ کارت جدید', onclick: () => cardEditor(p, null) }),

      h('button', { class: 'btn ghost', text: 'درس‌ها و مبحث‌ها', onclick: () => manageSubjects(p) }))),
    grid);

  function drawGrid() {
    const list = filtered(); info.textContent = fa(list.length) + ' کارت'; grid.innerHTML = '';
    if (!list.length) grid.append(h('p', { class: 'muted', text: d.subjects.length ? 'کارتی در این بخش نیست.' : 'ابتدا از «درس‌ها و مبحث‌ها» یک درس و مبحث بسازید، سپس «کارت جدید».' }));
    list.forEach((c) => {
      const s = d.subjects.find((x) => x.id === c.sid), t = s && s.topics.find((x) => x.id === c.tid); const u = lsGet(cardKey(c.id, 'f'));
      grid.append(h('div', { class: 'fc', onclick: () => cardEditor(p, c) },
        h('div', { class: 'paper ' + (d.paper || 'ruled') }, u ? h('img', { src: u }) : null),
        h('div', { class: 'muted', text: (s ? s.name : '؟') + ' › ' + (t ? t.name : '؟') }),
        h('div', { class: 'muted', text: 'جعبه ' + fa(c.box) + ' • ✓' + fa(c.right) + ' ✗' + fa(c.wrong) })));
    });
  }
  fillSubs(); drawGrid();
}

function manageSubjects(p) {
  const d = p.data; const box = h('div');
  const dropCards = (pred) => { d.cards.filter(pred).forEach(removeCardData); d.cards = d.cards.filter((c) => !pred(c)); };
  function redraw() {
    box.innerHTML = '';
    box.append(h('button', { class: 'btn', text: '＋ درس جدید', onclick: () => { askText('نام درس:', '', (n) => { d.subjects.push({ id: newId(), name: n, topics: [] }); save(); redraw(); render(); }); } }));
    if (!d.subjects.length) box.append(h('p', { class: 'muted', text: 'هنوز درسی نساخته‌اید.' }));
    d.subjects.forEach((s) => {
      box.append(h('div', { class: 'drow', style: 'margin-top:10px' }, h('b', { style: 'flex:1', text: '📚 ' + s.name }),
        h('button', { class: 'icon-btn', text: '＋ مبحث', onclick: () => { askText('نام مبحث (برای درس ' + s.name + '):', '', (n) => { s.topics.push({ id: newId(), name: n }); save(); redraw(); render(); }); } }),
        h('button', { class: 'icon-btn', text: '✎', onclick: () => { askText('نام درس:', s.name, (n) => { s.name = n; save(); redraw(); render(); }); } }),
        h('button', { class: 'icon-btn', text: '🗑', onclick: () => { askConfirm('درس «' + s.name + '» با همه‌ی مبحث‌ها و کارت‌هایش حذف شود؟', () => { dropCards((c) => c.sid === s.id); d.subjects = d.subjects.filter((x) => x !== s); save(); redraw(); render(); }); } })));
      s.topics.forEach((t) => box.append(h('div', { class: 'drow', style: 'padding-inline-start:20px' }, h('span', { style: 'flex:1;padding:6px 4px', text: '• ' + t.name + ' (' + fa(d.cards.filter((c) => c.tid === t.id).length) + ')' }),
        h('button', { class: 'icon-btn', text: '✎', onclick: () => { askText('نام مبحث:', t.name, (n) => { t.name = n; save(); redraw(); render(); }); } }),
        h('button', { class: 'icon-btn', text: '🗑', onclick: () => { askConfirm('مبحث «' + t.name + '» با کارت‌هایش حذف شود؟', () => { dropCards((c) => c.tid === t.id); s.topics = s.topics.filter((x) => x !== t); save(); redraw(); render(); }); } }))));
    });
  }
  redraw(); openModal('درس‌ها و مبحث‌ها', box);
}

function cardEditor(p, card) {
  const d = p.data; const pen = { tool: 'pen', color: '#111827', size: 3 };
  const getPen = () => ({ tool: pen.tool, color: pen.color, size: pen.size, penOnly: d.penOnly });
  const front = inkPad(getPen), back = inkPad(getPen); const pads = [front, back]; let side = 0;
  pads.forEach((pd) => { pd.setPaper(d.paper || 'ruled'); pd.setTouch(!!d.penOnly); });
  if (card) { front.load(lsGet(cardKey(card.id, 'f'))); back.load(lsGet(cardKey(card.id, 'b'))); }

  const sSel = h('select'), tSel = h('select');

  }

    tSel.value = s && s.topics.find((t) => t.id === want) ? want : (s && s.topics[0] ? s.topics[0].id : '');
  }
  sSel.addEventListener('change', () => fillT(''));
  fillS(card ? card.sid : d.sel.sid);

  /* ابزارها */
  const showSide = (i) => { side = i; front.el.style.display = i === 0 ? '' : 'none'; back.el.style.display = i === 1 ? '' : 'none'; tabs.forEach((b, k) => b.classList.toggle('active', k === i)); };
  const tabs = [h('button', { class: 'btn ghost', text: 'رو', onclick: () => showSide(0) }), h('button', { class: 'btn ghost', text: 'پشت', onclick: () => showSide(1) })];

  const colors = ['#111827', '#1d4ed8', '#dc2626', '#16a34a', '#7c3aed', '#ea580c'].map((c) => { const b = h('button', { class: 'sw', style: 'background:' + c, 'data-c': c, onclick: () => setColor(c) }); sw.push(b); return b; });

  const penOnly = h('input', { type: 'checkbox', checked: !!d.penOnly, onchange: () => { d.penOnly = penOnly.checked; save(); pads.forEach((pd) => pd.setTouch(d.penOnly)); } });
  const paperSel = selectBox([['ruled', 'خط‌دار'], ['grid', 'شطرنجی'], ['plain', 'ساده']], d.paper || 'ruled', (x) => { d.paper = x; save(); pads.forEach((pd) => pd.setPaper(x)); });

  const tools = h('div', { class: 'tools' }, tabs, toolB.pen, toolB.eraser, colors, h('span', { class: 'muted', text: 'ضخامت' }), size,
    h('button', { class: 'btn ghost', text: '↶ بازگردانی', onclick: () => pads[side].undo() }),
    h('button', { class: 'btn ghost', text: 'پاک‌کردن این طرف', onclick: () => pads[side].clear() }));
  const opts = h('div', { class: 'tools' }, h('label', {}, penOnly, ' فقط قلم (نادیده گرفتن لمس انگشت)'), h('span', { class: 'muted', text: 'کاغذ:' }), paperSel);

  const actions = h('div', { class: 'row', style: 'margin-top:12px' },
    h('button', { class: 'btn', text: 'ذخیره', onclick: () => {
      const sid = sSel.value, tid = tSel.value; if (!sid || !tid) { toast('درس و مبحث را انتخاب کنید (با ＋ بسازید).'); return; }
      if (!front.hasInk() && !back.hasInk()) { toast('هنوز چیزی ننوشته‌اید.'); return; }
      const c = card || { id: newId(), created: Date.now(), box: 1, right: 0, wrong: 0, last: 0 }; c.sid = sid; c.tid = tid;
      [[front, 'f'], [back, 'b']].forEach(([pd, sd]) => { if (pd.hasInk()) lsSet(cardKey(c.id, sd), pd.url()); else { try { localStorage.removeItem(cardKey(c.id, sd)); } catch (e) {} } });

/* ---------- آمار ---------- */
function statsOfTopics(list) {
  let hours = 0, reads = 0, reviews = 0, tests = 0, ps = 0, pw = 0, done = 0;
  list.forEach((t) => {
    hours += t.hours || 0; reads += t.reads || 0; reviews += t.reviews || 0; tests += t.tests || 0; if (t.done) done++;
    if (t.testPct != null) { const w = t.tests || 1; ps += t.testPct * w; pw += w; }          // میانگین وزنی بر اساس تعداد تست
  });

}
const examStats = (e) => statsOfTopics(e.topics);
const courseStats = (c) => statsOfTopics([].concat(...c.exams.map((e) => e.topics)));
const score20 = (c) => c.final == null ? null : c.final / (c.finalMax || 20) * 20;
function gpaOf(courses) {                          // معدل با ضریب واحد، بر مبنای ۲۰
  let u = 0, s = 0;
  courses.forEach((c) => { const x = score20(c); if (x != null && c.units > 0) { u += c.units; s += x * c.units; } });
  return u ? s / u : null;
}
function nextExam(courses) {                       // نزدیک‌ترین امتحان آینده
  let best = null; const today = todayISO();
  courses.forEach((c) => c.exams.forEach((e) => { if (!e.date) return; const left = daysBetween(today, e.date); if (left >= 0 && (!best || left < best.left)) best = { c, e, left }; }));
  return best;
}

  const tm = c.start ? ' ' + fa(c.start) + '–' + fa(c.end || addMin(c.start, 120)) : '';
  if (c.freq === 'custom') return (c.freqName || 'برنامه‌ی ویژه') + (ds ? ' (' + ds + ')' : '') + tm;

}

/* نمودار ستونی گروهی (مثلاً درصد تست‌ها در برابر درصد امتحان) — محور ۰ تا ۱۰۰ */
function groupedBars(labels, series) {
  const W = 700, Hh = 260; const cv = h('canvas', { class: 'chart' }); cv.width = W; cv.height = Hh; const c = cv.getContext('2d');
  const ink = cssVar('--ink', '#1c2230'), mut = cssVar('--muted', '#6b7385'), line = cssVar('--line', '#dfe3ec');
  const pl = 12, pr = 40, pt = 18, pb = 30; c.font = '12px Tahoma, sans-serif'; c.lineWidth = 1; c.strokeStyle = line;
  for (let i = 0; i <= 4; i++) { const y = pt + (Hh - pt - pb) * (1 - i / 4); c.beginPath(); c.moveTo(pl, y); c.lineTo(W - pr, y); c.stroke(); c.fillStyle = mut; c.textAlign = 'left'; c.fillText(fa(i * 25), W - pr + 6, y + 4); }
  const n = labels.length, slot = (W - pl - pr) / Math.max(1, n), k = series.length, bw = Math.min(30, slot * 0.8 / k);
  labels.forEach((lb, i) => {
    const cx = pl + slot * (n - 1 - i) + slot / 2;
    series.forEach((s, j) => {
      const val = s.values[i]; if (val == null) return; const x = cx - (k * bw) / 2 + j * bw, bh = (Hh - pt - pb) * Math.min(100, val) / 100;
      c.fillStyle = s.color; c.fillRect(x, Hh - pb - bh, bw - 2, bh); c.fillStyle = ink; c.textAlign = 'center'; c.fillText(fa(Math.round(val)), x + bw / 2, Hh - pb - bh - 4);
    });
    c.fillStyle = mut; c.textAlign = 'center'; c.fillText(lb, cx, Hh - pb + 17);
  });
  return h('div', {}, cv, h('div', { class: 'row muted' }, series.map((s) => h('span', {}, h('span', { style: 'display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:4px;background:' + s.color }), s.name))));
}

/* =====================================================================
   6i) زمان، سابقه‌ی مطالعه‌ی مبحث‌ها، برنامه‌ی روزانه (ساعتی) و تایمر
   ===================================================================== */
const r2 = (x) => Math.round(x * 100) / 100;

  return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
}
const minOf = (hhmm) => { const [a, b] = hhmm.split(':').map(Number); return a * 60 + b; };
const msOf = (iso, hhmm) => { const [y, m, d] = parseISO(iso); const [a, b] = (hhmm || '00:00').split(':').map(Number); return new Date(y, m - 1, d, a, b).getTime(); };
const isoOfMs = (ms) => { const d = new Date(ms); return isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const hhmmOfMs = (ms) => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function durText(sec) {
  sec = Math.max(0, Math.round(sec)); const hh = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
  if (!hh && !mm) return sec ? 'کمتر از ۱ دقیقه' : '۰ دقیقه';
  return (hh ? fa(hh) + ' ساعت' : '') + (hh && mm ? ' و ' : '') + (mm ? fa(mm) + ' دقیقه' : '');
}
const clock = (sec) => fa(pad2(Math.floor(sec / 3600)) + ':' + pad2(Math.floor(sec % 3600 / 60)) + ':' + pad2(Math.floor(sec % 60)));

/* ---------- سابقه‌ی مطالعه‌ی یک مبحث (topic.log) ---------- */
function topicLogAdd(t, entry) { t.log = t.log || []; t.log.push(entry); t.hours = r2((t.hours || 0) + entry.sec / 3600); }

  const e = (t.log || []).find((x) => x.id === id); if (!e) return;

  const e = (t.log || []).find((x) => x.id === id); if (!e) return; const old = e.sec; Object.assign(e, patch);
  t.hours = Math.max(0, r2((t.hours || 0) + (e.sec - old) / 3600));
}
function allUniCourses() {                          // همه‌ی درس‌ها در همه‌ی نیمسال‌ها

function layoutDay(items) {                          // ستون‌بندی رویدادهای هم‌زمان
  items.sort((a, b) => a.s - b.s || b.e - a.e); let cluster = [], clusterEnd = 0, colsEnd = [];
  const flush = () => { const n = colsEnd.length; cluster.forEach((x) => { x.n = n; }); cluster = []; colsEnd = []; };
  items.forEach((it) => {
    if (cluster.length && it.s >= clusterEnd) flush();
    let c = colsEnd.findIndex((e) => e <= it.s); if (c < 0) { c = colsEnd.length; colsEnd.push(0); }
    colsEnd[c] = it.e; it.col = c; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  });
  flush(); return items;
}
function syncEventLog(ev) {                          // رویداد مطالعه‌ی مبحث: با تیک «انجام شد» در سابقه‌ی مبحث ثبت می‌شود

/* پنجره‌ی ثبت/ویرایش جلسه: تاریخ، ساعت شروع و پایان، توقف‌ها، موضوع (و درس/امتحان/مبحث) */

  const d = p.data;
  const dp = jDatePicker(isoOfMs(init.start), false);
  const st = h('input', { type: 'time', value: hhmmOfMs(init.start) }), en = h('input', { type: 'time', value: hhmmOfMs(init.end) });
  const pauseRows = []; const pbox = h('div'); const netEl = h('b');
  function addPauseRow(pz) {
    const f = h('input', { type: 'time', value: pz ? hhmmOfMs(pz.from) : '' }), t = h('input', { type: 'time', value: pz ? hhmmOfMs(pz.to) : '' });
    const row = { f, t, orig: pz || null }; pauseRows.push(row);
    const el = h('div', { class: 'row', style: 'margin-top:4px' }, h('span', { class: 'muted', text: 'توقف از' }), f, h('span', { class: 'muted', text: 'تا' }), t,
      h('button', { class: 'icon-btn', text: '✕', onclick: () => { pauseRows.splice(pauseRows.indexOf(row), 1); el.remove(); calc(); } }));
    f.addEventListener('change', calc); t.addEventListener('change', calc); pbox.append(el);
  }
  function compute() {
    const day = dp.get(); if (!st.value || !en.value) return null;
    const s = (hhmmOfMs(init.start) === st.value && isoOfMs(init.start) === day) ? init.start : msOf(day, st.value);   // بدون تغییر ← زمان دقیق (با ثانیه)
    let e = (s === init.start && hhmmOfMs(init.end) === en.value) ? init.end : msOf(isoOfMs(s), en.value);
    if (e <= s) e += 86400000;                                    // پایان بعد از نیمه‌شب
    const pauses = []; let total = 0;

      let a = (r.orig && hhmmOfMs(r.orig.from) === r.f.value) ? r.orig.from : msOf(isoOfMs(s), r.f.value); if (a < s) a += 86400000;
      let b = (r.orig && hhmmOfMs(r.orig.to) === r.t.value) ? r.orig.to : msOf(isoOfMs(a), r.t.value); if (b <= a) b += 86400000;

  }

  init.pauses.forEach(addPauseRow);
  [st, en].forEach((x) => x.addEventListener('change', calc));

  const showPk = () => { pkBox.style.display = subSel.value === 'uni' ? '' : 'none'; }; subSel.addEventListener('change', showPk); showPk();
  const note = h('input', { type: 'text', value: init.note || '', placeholder: 'توضیح (اختیاری)', style: 'width:100%' });
  openModal(editing ? 'ویرایش جلسه' : 'ثبت جلسه', h('div', {},
    h('div', { class: 'row' }, h('span', { class: 'muted', text: 'روز:' }), dp.el),
    h('div', { class: 'row', style: 'margin-top:8px' }, h('span', { class: 'muted', text: 'شروع:' }), st, h('span', { class: 'muted', text: 'پایان:' }), en),
    h('div', { style: 'margin-top:8px' }, h('b', { text: 'توقف‌ها' }), pbox, h('button', { class: 'btn ghost', style: 'margin-top:6px', text: '＋ توقف', onclick: () => { addPauseRow(null); } })),
    h('div', { style: 'margin-top:8px' }, netEl),
    h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'muted', text: 'موضوع:' }), subSel,
      h('button', { class: 'btn ghost', text: '＋ موضوع جدید', onclick: () => askText('نام موضوع:', '', (n) => { if (!d.subjects.includes(n) && n !== 'دانشگاه') d.subjects.push(n); save(); closeModal(); sessionDialog(p, Object.assign({}, init, { subject: n }), editing, after); }) })),
    pkBox, note,
    h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn', text: 'ثبت', onclick: () => {
      const c = compute(); if (!c || c.sec <= 0) { toast('زمان مطالعه باید بیشتر از صفر باشد.'); return; }
      let ref = null; if (subSel.value === 'uni') { ref = pk.get(); if (!ref) { toast('درس، امتحان و مبحث را انتخاب کنید.'); return; } }

    } }))));

function jobShiftsFor(iso) {                           // کارهای این روز: [{start, end, note}]
  const P = state.profile; if (!P || !P.job || !P.job.has) return [];
  const j = P.job; const [gy, gm, gd] = parseISO(iso); const wd = (new Date(gy, gm - 1, gd).getDay() + 1) % 7; const jd = g2j(gy, gm, gd); const out = [];
  if (j.mode === 'fixed') { if ((j.days || []).includes(wd)) out.push({ start: j.start || '', end: j.end || '', note: '' }); }
  else if (j.mode === 'weekly') j.entries.filter((e) => Number(e.day) === wd).forEach((e) => out.push(e));
  else if (j.mode === 'monthly') { const len = monthLength(jd[0], jd[1]); j.entries.filter((e) => Math.min(Number(e.day), len) === jd[2]).forEach((e) => out.push(e)); }   // روز ۳۱ در ماه ۳۰روزه ← آخر ماه
  return out;
}

  const durs = d.cycles.filter((c) => c.end).map((c) => daysBetween(c.start, c.end) + 1).filter((x) => x >= 1 && x <= 14);

      h('button', { class: 'btn', style: 'margin-top:12px', text: 'ذخیره', onclick: () => {

/* =====================================================================
   7) صفحه‌ی رنگ‌آمیزی (Canvas)
   - امروز را تشخیص می‌دهد (تقویم شمسی)
   - فقط داخل «ناحیه‌ی» همان روز می‌شود کشید (clip)

let pendingSetupFor = null;       // بعد از ساخت دوباره‌ی صفحه، حالت تنظیم ناحیه‌ها روشن شود

  const d = p.data; const { year, month } = p.params;
  if (!d.seeds) d.seeds = []; if (d.thr == null) d.thr = 170; if (d.close == null) d.close = 1;
  const isImage = d.layout === 'image';
  const days = monthLength(year, month); const t = jToday();
  const todayIdx = (t.jy === year && t.jm === month) ? t.jd - 1 : -1;     // اندیس ناحیه‌ی امروز
  const W = 900; let H = W; let sel = todayIdx; let bgImg = null;
  const setup = { on: false, day: 1 };

  v.append(backBar(p), h('h2', { text: p.title }));
  const info = h('p', { class: 'muted' });
  v.append(info);

  const cv = h('canvas', { class: 'paint' });  const c = cv.getContext('2d');
  const layer = document.createElement('canvas'); const lc = layer.getContext('2d');   // نقاشی کاربر

  const rows = () => d.rows > 0 ? d.rows : Math.ceil((days + d.offset) / d.cols);

  let lab = null, labSize = [], labelOfDay = [], dayOfLabel = new Map(), tintCv = null;
  function analyze() {
    const t0 = document.createElement('canvas'); t0.width = W; t0.height = H;
    const g = t0.getContext('2d'); g.drawImage(bgImg, 0, 0, W, H);
    const px = g.getImageData(0, 0, W, H).data; const n = W * H;

  function buildTint() {                                         // رنگ‌های آزمایشی برای حالت تنظیم ناحیه‌ها

  }

    } else { m = document.createElement('canvas'); m.width = W; m.height = H; const mc = m.getContext('2d'); regionPath(mc, i); mc.fillStyle = '#fff'; mc.fill(); }

  /* ---------- رسم صفحه ---------- */

    c.direction = 'rtl'; c.font = 'bold 26px Tahoma, sans-serif'; c.textBaseline = 'middle';

      if (d.layout === 'radial') {

        c.textAlign = 'center'; c.fillText(fa(i + 1), W / 2 + rr * Math.cos(am), H / 2 + rr * Math.sin(am));
      } else { const r = cell(i); c.textAlign = d.rtl ? 'right' : 'left'; c.fillText(fa(i + 1), d.rtl ? r.x + r.w - 10 : r.x + 10, r.y + 24); }
    }
    if (d.layout === 'radial') {
      c.beginPath(); c.arc(W / 2, H / 2, R0(), 0, 2 * Math.PI); c.stroke();
      c.textAlign = 'center'; c.font = 'bold 22px Tahoma, sans-serif';
      c.fillText(MONTHS[month - 1], W / 2, H / 2 - 12); c.fillText(fa(year), W / 2, H / 2 + 14);
    }
    c.restore();
  }
  const curIdx = () => d.lockToday ? todayIdx : sel;
  function paint() {
    c.clearRect(0, 0, W, H); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  let saveT; function persist() { clearTimeout(saveT); saveT = setTimeout(() => lsSet(drawKey(p.id), layer.toDataURL('image/png')), 300); }

  /* ---------- کشیدن: همه‌ی ضربه‌ها از «ماسک» ناحیه عبور می‌کنند ---------- */
  const pen = d.pen;
  function stroke(a, b, mask) {

    h('button', { class: 'btn ghost', text: 'پاک‌کردن روز انتخاب‌شده', onclick: () => {

  /* ---------- حالت تنظیم ناحیه‌ها (برای عکس خودتان) ---------- */
  function updateSetup() {
    setupBar.style.display = setup.on ? 'block' : 'none'; setupBar.innerHTML = '';
    if (!setup.on) return;
    setupBar.append(h('b', { text: 'روی ناحیه‌ی روز ' + fa(setup.day) + ' (از ' + fa(days) + ') یک بار بزنید' }),
      h('p', { class: 'muted', text: 'هر ناحیه با رنگ آزمایشی پر می‌شود تا درستی‌اش را ببینید. اگر رنگی بیرون ناحیه ریخت، «بستن شکاف خطوط» را در تنظیمات بیشتر کنید.' }),
      h('div', { class: 'row' },
        h('button', { class: 'btn ghost', text: '‹ روز قبل', onclick: () => { setup.day = Math.max(1, setup.day - 1); updateSetup(); } }),
        h('button', { class: 'btn ghost', text: 'رد شدن ›', onclick: () => { setup.day = Math.min(days, setup.day + 1); updateSetup(); } }),
        h('button', { class: 'btn', text: '✓ پایان', onclick: () => { setup.on = false; updateSetup(); render(); } })));
  }
  function infoText() {
    if (isImage && !bgImg) return 'ابتدا از ⚙ تنظیمات صفحه، عکس خودتان را بارگذاری کنید.';
    if (isImage && todayIdx >= 0 && !labelOfDay[todayIdx]) return 'برای روز ' + fa(todayIdx + 1) + ' ناحیه تعریف نشده: ⚙ تنظیمات ← تنظیم ناحیه‌ی روزها.';
    return todayIdx >= 0
      ? 'امروز: ' + WEEKDAYS[t.wd] + ' ' + fa(t.jd) + ' ' + MONTHS[t.jm - 1] + ' – فقط ناحیه‌ی روز ' + fa(t.jd) + ' (دورخط‌شده) قابل رنگ‌آمیزی است.'
      : 'این صفحه برای ماه دیگری است؛ برای رنگ کردن هر روز، تیک «فقط امروز» را بردارید.';
  }

  /* ---------- تنظیمات صفحه ---------- */
  function settings() {
    const layout = selectBox([['grid', 'شبکه (خانه‌خانه)'], ['radial', 'گل (گلبرگی)'], ['image', 'عکس خودتان (ناحیه‌های نامنظم)']], d.layout);
    const cols = h('input', { type: 'number', min: 1, max: 31, value: d.cols, style: 'width:80px' });
    const rowsIn = h('input', { type: 'number', min: 0, max: 31, value: d.rows, style: 'width:80px' });
    const off = h('input', { type: 'number', min: 0, max: 30, value: d.offset, style: 'width:80px' });
    const rtl = h('input', { type: 'checkbox', checked: d.rtl });
    const file = h('input', { type: 'file', accept: 'image/*' });
    const thr = h('input', { type: 'range', min: 80, max: 230, value: d.thr });
    const close = h('input', { type: 'range', min: 0, max: 4, value: d.close });
    const gridBox = h('div', {},
      h('div', { class: 'row', style: 'margin-top:8px' }, h('span', { text: 'ستون:' }), cols, h('span', { text: 'ردیف (۰ = خودکار):' }), rowsIn),
      h('div', { class: 'row', style: 'margin-top:8px' }, h('span', { text: 'خانه‌ی خالی ابتدا:' }), off, h('label', {}, rtl, ' شروع از راست')));
    const imgBox = h('div', {},
      h('p', { class: 'muted', text: 'عکس صفحه‌ی خط‌دار (مثلاً مود تراکر) را بارگذاری کنید. هر ناحیه‌ی بسته‌ی بین خط‌ها یک روز است.' }),
      h('div', { class: 'row' }, h('span', { text: 'حساسیت خطوط' }), thr),
      h('div', { class: 'row' }, h('span', { text: 'بستن شکاف خطوط' }), close),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('button', { class: 'btn', text: '🎯 تنظیم ناحیه‌ی روزها', onclick: () => apply(() => { pendingSetupFor = p.id; }) }),
        h('button', { class: 'btn ghost', text: '🌊 نقطه‌های آماده‌ی عکس موج', onclick: () => {
          askConfirm('این نقطه‌ها فقط برای همان عکس «mood tracker موج» درست است. اعمال شود؟', () => { d.seeds = WAVE_SEEDS.map((s) => s.slice()); save(); apply(); }, 'اعمال شود'); } })));
    const show = () => { gridBox.style.display = layout.value === 'image' ? 'none' : 'block'; imgBox.style.display = layout.value === 'image' ? 'block' : 'none'; };
    layout.addEventListener('change', show); show();

    function apply(after) {                                      // ذخیره‌ی تنظیمات و ساخت دوباره‌ی صفحه
      d.layout = layout.value; d.cols = Math.max(1, Number(cols.value) || 7); d.rows = Math.max(0, Number(rowsIn.value) || 0);
      d.offset = Math.max(0, Number(off.value) || 0); d.rtl = rtl.checked; d.thr = Number(thr.value); d.close = Number(close.value); save();
      const done = () => { closeModal(); if (after) after(); render(); };
      const f = file.files[0];
      if (!f) { done(); return; }
      const fr = new FileReader();
      fr.onload = () => {                                        // کوچک‌کردن عکس برای صرفه‌جویی در حافظه
        const im = new Image();
        im.onload = () => {
          const s = Math.min(1, 1400 / im.width); const t2 = document.createElement('canvas');
          t2.width = Math.round(im.width * s); t2.height = Math.round(im.height * s);
          t2.getContext('2d').drawImage(im, 0, 0, t2.width, t2.height);
          lsSet(imgKey(p.id), t2.toDataURL('image/jpeg', 0.88)); localStorage.removeItem(drawKey(p.id)); done();
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(f);
    }
    const box = h('div', {}, h('div', { class: 'row' }, h('span', { text: 'نوع:' }), layout), gridBox, imgBox,
      h('h3', { text: 'عکس پس‌زمینه' }), file,
      h('p', { class: 'muted', text: 'با تعویض عکس، نقاشی قبلی این صفحه پاک می‌شود.' }),
      h('div', { class: 'row', style: 'margin-top:12px' },
        h('button', { class: 'btn', text: 'اعمال', onclick: () => apply() }),
        h('button', { class: 'btn ghost', text: 'حذف عکس', onclick: () => { try { localStorage.removeItem(imgKey(p.id)); } catch (e) {} closeModal(); render(); } })));
    openModal('تنظیمات صفحه', box);
  }

  /* ---------- شروع ---------- */
  function start() {
    size();
    if (isImage && bgImg) analyze();
    info.textContent = infoText();
    if (isImage && !bgImg && !d.askedSetup) { d.askedSetup = true; save(); setTimeout(settings, 50); }
    const saved = lsGet(drawKey(p.id));
    const afterDraw = () => { setTool(pen.tool); setColor(pen.color); paint(); if (pendingSetupFor === p.id) { pendingSetupFor = null; setup.on = true; setup.day = 1; updateSetup(); paint(); } };
    if (saved) { const im = new Image(); im.onload = () => { lc.drawImage(im, 0, 0, W, H); afterDraw(); }; im.src = saved; } else afterDraw();
  }
  const bgData = lsGet(imgKey(p.id));
  if (bgData) { bgImg = new Image(); bgImg.onload = start; bgImg.onerror = () => { bgImg = null; start(); }; bgImg.src = bgData; }
  else start();
}

/* =====================================================================
   8) رندر اصلی، کشو و پشتیبان
   ===================================================================== */
function render() {
  if (timerTick) { clearInterval(timerTick); timerTick = null; }
  if (isLocked()) { showLock(); return; }
  hideLock();
  document.body.classList.toggle('dark', state.dark);
  const page = currentPage();
  $('#pageTitle').textContent = page.title;
  const view = $('#view'); view.innerHTML = '';
  TEMPLATES[page.type].render(page, view);
  renderDrawer();
  if (page.id !== lastPageId) { window.scrollTo(0, 0); lastPageId = page.id; }   // فقط وقتی صفحه عوض شد
}
let lastPageId = null;
function toggleDrawer(open) { $('#drawer').classList.toggle('open', open); }
function renderDrawer() {
  const box = $('#drawerList'); box.innerHTML = '';
  state.pages.forEach((p) => box.append(h('div', { class: 'drow' },
    h('button', { class: 'dlink', text: TEMPLATES[p.type].icon + ' ' + p.title, onclick: () => { toggleDrawer(false); go(p.id); } }),
    h('button', { class: 'icon-btn', text: '✎', title: 'تغییر نام', onclick: () => {
      askText('نام صفحه:', p.title, (x) => { p.title = x; save(); render(); });
    } }),
    h('button', { class: 'icon-btn', text: '🗑', title: 'حذف', onclick: () => deletePage(p.id) }))));
}

$('#menuBtn').addEventListener('click', () => toggleDrawer(true));
$('#closeDrawer').addEventListener('click', () => toggleDrawer(false));
$('#homeBtn').addEventListener('click', () => go(''));
$('#addBtn').addEventListener('click', addPageDialog);
$('#profBtn').addEventListener('click', openProfile);
$('#themeBtn').addEventListener('click', () => { state.dark = !state.dark; save(); render(); });
window.addEventListener('hashchange', render);

$('#exportBtn').addEventListener('click', () => {
  const blobs = {};
  state.pages.forEach((p) => { pageBlobKeys(p).forEach((k) => { const x = lsGet(k); if (x) blobs[k] = x; }); });
  const b = new Blob([JSON.stringify({ state, blobs })], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(b), download: 'planner-backup-' + todayISO() + '.json' }); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.state || !Array.isArray(data.state.pages)) throw new Error('bad');
      askConfirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟', () => {
        state = Object.assign({ pages: [], links: {}, dark: false }, data.state);
        Object.entries(data.blobs || {}).forEach(([k, val]) => lsSet(k, val));
        save(); toggleDrawer(false); go('');
      }, 'جایگزین شود');
    } catch (err) { toast('فایل پشتیبان معتبر نیست.'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* =====================================================================
   9) شروع
   ===================================================================== */
load();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('ثبت حالت آفلاین ناموفق بود:', err));
  });
}
</script>
</body>
